---
# Reusable workflow: lint the collection's extra docs, links and plugin docs with
# antsibull-docs.
name: Docs lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-lint:
    name: Lint extra docsite docs and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the collection repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install ansible-core and antsibull-docs
        run: python -m pip install --disable-pip-version-check ansible-core antsibull-docs

      - name: Install the collection and its dependencies
        run: ansible-galaxy collection install .

      - name: Run collection docs linter
        run: antsibull-docs lint-collection-docs . --plugin-docs --skip-rstcheck
