---
# Runs on this repository only: lint the reusable workflows and the caller examples.
name: GitHub workflow lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  # Commit of rhysd/actionlint v1.7.12, used to fetch the download script.
  ACTIONLINT_SHA: 914e7df21a07ef503a81201c76d2b11c789d3fca

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: >-
          bash <(curl -fsSL
          "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash")
          "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"

      - name: Run actionlint
        run: >-
          "${RUNNER_TEMP}/actionlint" -color
          .github/workflows/*.yml examples/*.yml

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor on the reusable workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github
          advanced-security: false
          annotations: true

      # The examples pin a placeholder SHA, which fails the online
      # impostor-commit audit, so they are audited offline.
      - name: Run zizmor on the example callers
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          # Example callers are outside .github/workflows, so list them explicitly.
          inputs: >-
            examples/certification.yml
            examples/changelog.yml
            examples/docs-lint.yml
            examples/sonarcloud.yml
            examples/units.yml
          online-audits: false
          advanced-security: false
          annotations: true

  lint-check:
    name: lint-check
    if: always()
    needs:
      - actionlint
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
