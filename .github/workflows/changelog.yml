---
# Reusable workflow: require a changelog fragment on pull requests.
#
# Wraps the ansible-network changelog workflow. Add the skip-changelog label to
# a pull request to bypass the check.
#
# The caller must trigger on pull_request with the types opened, reopened,
# labeled, unlabeled and synchronize so that adding or removing the label
# re-evaluates the check.
name: Changelog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The check inside is skipped when the pull request has the skip-changelog label.
  # ansible-network/github_actions has no release tags, so this pin is updated by hand.
  changelog:
    uses: ansible-network/github_actions/.github/workflows/changelog.yml@38b45197e14346c2e1b9d4bca048d0ff8c29a9b2 # main
