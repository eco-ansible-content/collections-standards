# Copy to sonar-project.properties at the root of the collection repository and
# replace <namespace>.<name> with the collection name.
#
# The SonarCloud workflow always reads this file from the default branch, so
# changes to it only take effect after they are merged.
#
# Complete documentation: https://docs.sonarsource.com/sonarqube-cloud/

# The SonarCloud workflow overrides these on the command line with the
# repository owner and "<owner>_<repository>". They are kept here for local
# scans.
sonar.projectKey=ansible-collections_<namespace>.<name>
sonar.organization=ansible-collections
sonar.projectName=<namespace>.<name>

sonar.sources=.
sonar.tests=tests/unit,tests/integration
sonar.python.version=3.12
sonar.newCode.referenceBranch=main

# Tests are analysed through sonar.tests; a file cannot be both a source and a
# test.
sonar.exclusions=tests/**,.tox/**

# The SonarCloud workflow overrides this with the coverage XML from the Units
# workflow. Kept here for local scans.
sonar.python.coverage.reportPaths=coverage.xml

# rules to ignore
sonar.issue.ignore.multicriteria=e1,e2
# dont require literals when creating empty lists, or dicts
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7498
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# dont require literals when creating empty sets
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7496
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# Collection-specific exclusions go below. Add the key to
# sonar.issue.ignore.multicriteria above and explain why the issue is safe to
# ignore, for example:
#
# This workflow uses pull_request_target but requires a manual approval to run.
# sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S7631
# sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/integration.yml
#
# Generated modules naturally share repetitive patterns.
# sonar.cpd.exclusions=plugins/modules/**
